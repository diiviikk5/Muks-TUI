[workspace]
members = [
  "muks-common",
  "muks-core",
  "muks-adapters",
  "muks-installer",
  "muks-syncd",
  "muks-tui",
  "muks-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Muks Team"]
license = "MIT"
repository = "https://github.com/diiviikk5/Muks"
description = "Muks is a Windows desktop customization control plane."

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crossterm = "0.29"
dirs = "6.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shlex = "1.3"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
